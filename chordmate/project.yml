# XcodeGen spec — generates Chordmate.xcodeproj from this layout.
#
# Install once:  brew install xcodegen
# Generate:      xcodegen generate
# Open:          open Chordmate.xcodeproj
#
# Manual setup is also fine — see README.md "Manual Xcode setup" section.

name: Chordmate
options:
  bundleIdPrefix: com.spacehaze
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Chordmate:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Models
      - path: State
      - path: Views
      - path: Audio
        excludes:
          - "Resources/README.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spacehaze.chordmate
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: Chordmate

# Tests live in Tests/MusicTheoryTests and run against the Package.swift
# library: `swift test` from the repo root. They aren't wired into the iOS
# app target because the music-theory code is pure Swift and doesn't need an
# iOS host to test.
